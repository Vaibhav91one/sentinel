name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @sentinel/scope-guard build

      - name: Start scope-guard
        run: |
          node mcp/scope-guard/dist/index.js &
          echo "5230" > /dev/null
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:9930/healthz && break
            sleep 1
          done

      - name: Protocol smoke tests
        run: node mcp/scope-guard/scripts/smoke.mjs

      - name: Scope unit checks (deny-by-default)
        run: |
          result=$(curl -s -H content-type:application/json -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":9,"method":"tools/call","params":{"name":"scope_check","arguments":{"target":"https://example.com"}}}' \
            http://127.0.0.1:9930/mcp)
          echo "$result" | grep -q '"allowed":false'
          echo "deny-by-default holds"
